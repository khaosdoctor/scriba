name: release

# On push to main: reads conventional commits since the last v* tag, bumps
# package.json, prepends the new section to CHANGELOG.md, commits it, tags
# vX.Y.Z, and publishes a GitHub Release. Pushes with no bump-worthy commits
# (docs/chore/style only) are skipped. Releasing is now automatic — no more
# manual `chore: release` commits.
#
# The image is built exactly once per release: publish.yml no longer runs on
# push to main; this workflow calls it only when a release is actually cut
# (skipped == false). The `if` guard skips this workflow's own release commits
# so it can't loop.
#
# Nothing is tagged or published unless the `verify` job below passes first.

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The gate. ci.yml runs on the same push but is a separate workflow, so nothing stopped a
  # red build from being tagged, published and deployed — which is exactly what happened to
  # v1.33.0. Re-running the checks here, in the workflow that does the releasing, means a
  # release can only be cut from a commit that actually passes. Node is pinned to the same
  # patch as ci.yml and the Dockerfile.
  verify:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - run: npm ci

      - name: biome ci (lint + format, no writes)
        run: npx @biomejs/biome ci .

      - run: npm run typecheck

      - run: npm test

  release:
    needs: verify
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: "./package.json"
          preset: "conventionalcommits"
          output-file: "CHANGELOG.md"
          tag-prefix: "v"
          git-message: "chore: release {version}"
          skip-on-empty: "true"

      - uses: softprops/action-gh-release@v2
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}

  publish:
    needs: release
    if: ${{ needs.release.outputs.skipped == 'false' }}
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.version }}
