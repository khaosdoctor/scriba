name: ci

# Runs on every push and PR so lint/format/type/test regressions are caught before merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Node is pinned to an exact patch, matching the Dockerfile: better-sqlite3's Statement
# destructor aborts the process on 24.19.0 (RemoveEnvironmentCleanupHook assertion), so a
# floating `24` breaks the DB test and hides real failures. Bump both together.
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches mise.toml / package.json engines (deploy runtime).
          node-version: 24.18.1

      - run: npm ci

      - name: biome ci (lint + format, no writes)
        run: npx @biomejs/biome ci .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - run: npm ci

      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - run: npm ci

      - run: npm test
